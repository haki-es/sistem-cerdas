<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block judul %}Optimasi Modifikasi Motor Sport{% endblock %}</title>
  <style>
    :root { --biru:#1d4ed8; --abu:#64748b; --garis:#e2e8f0; --latar:#f8fafc; --hijau:#15803d; --merah:#b91c1c; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--latar); color:#0f172a; line-height:1.5; }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 0 16px; }
    header { background:#0f172a; color:#fff; }
    header .wrap { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; padding-top:12px; padding-bottom:12px; }
    header a { color:#fff; text-decoration:none; }
    .brand { font-weight:700; }
    nav a { margin-left:16px; opacity:.85; }
    nav a:hover { opacity:1; }
    main { padding-top:24px; padding-bottom:40px; }
    h1 { margin:0 0 4px; font-size:1.6rem; }
    .sub { color:var(--abu); margin:0 0 20px; }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap:20px; }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
    .card { background:#fff; border:1px solid var(--garis); border-radius:12px; padding:20px; }
    .card h2 { margin-top:0; font-size:1.15rem; }
    label { font-weight:600; display:block; margin-bottom:4px; }
    input[type=number] { width:100%; padding:8px 10px; border:1px solid #cbd5e1; border-radius:8px; font-size:1rem; }
    .field { margin-bottom:14px; }
    .help { color:var(--abu); font-size:.85rem; margin-top:2px; }
    .err { color:var(--merah); font-size:.9rem; }
    ul { list-style:none; padding:0; margin:0; }
    .field ul li { margin:4px 0; }
    .field ul li label { font-weight:400; display:inline; }
    button { background:var(--biru); color:#fff; border:0; border-radius:8px; padding:10px 18px; font-size:1rem; cursor:pointer; }
    button:hover { background:#1e40af; }
    table { width:100%; border-collapse:collapse; font-size:.95rem; }
    th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--garis); }
    th { background:#f1f5f9; }
    td.num, th.num { text-align:right; }
    .tabel-scroll { overflow-x:auto; }
    .stat { display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:12px; margin-bottom:20px; }
    .stat div { background:#fff; border:1px solid var(--garis); border-radius:12px; padding:14px; }
    .stat b { display:block; font-size:1.4rem; }
    .stat span { color:var(--abu); font-size:.85rem; }
    .ok { color:var(--hijau); font-weight:600; }
    .bad { color:var(--merah); font-weight:600; }
    a.link { color:var(--biru); }
    footer { color:var(--abu); font-size:.85rem; text-align:center; padding:20px 16px 32px; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="brand" href="{% url 'index' %}">🏍️ Optimasi Modifikasi Motor Sport</a>
      <nav>
        <a href="{% url 'index' %}">Optimasi</a>
        <a href="{% url 'riwayat' %}">Riwayat</a>
        {% if user.is_staff %}<a href="{% url 'cek_supabase' %}">Supabase</a>{% endif %}
        <a href="{% url 'admin:index' %}">Admin</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% block isi %}{% endblock %}
  </main>
  <footer>
    Sistem Cerdas (TI24317) · Algoritma Genetika · Pengembangan Modul 14<br>
    Haki Eko Saputra · 253307013 · 3A · Teknologi Informasi · Politeknik Negeri Madiun
  </footer>
</body>
</html>
